<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <title>Vault Export</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      
      :root{
        --bg1:#0a0e1a; --bg2:#050810; --card:#ffffff; --muted:#94a3b8; 
        --accent:#8b5cf6; --accent-hover:#7c3aed; --glow:#a78bfa;
      }
      
      *{box-sizing:border-box;}
      html,body{height:100%;margin:0;padding:0;}
      
      body{
        min-height:100vh;
        background:radial-gradient(ellipse at top, #1e1b4b 0%, #0f172a 50%, #020617 100%);
        position:relative;
        color:#111827;
        font-family:'Inter', system-ui, -apple-system, sans-serif;
        overflow-x:hidden;
      }
      
      /* Animated background particles */
      body::before{
        content:'';
        position:fixed;
        top:0;left:0;right:0;bottom:0;
        background-image:
          radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 40% 20%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
        animation:drift 20s ease-in-out infinite;
        pointer-events:none;
        z-index:0;
      }
      
      @keyframes drift{
        0%,100%{transform:translate(0,0) scale(1);}
        50%{transform:translate(30px,-30px) scale(1.1);}
      }
      
      .site-wrap{
        max-width:1200px;
        margin:0 auto;
        padding:48px 32px;
        position:relative;
        z-index:1;
      }
      
      .hero{
        display:flex;
        align-items:center;
        gap:24px;
        margin-bottom:48px;
        animation:fadeInDown 0.6s ease-out;
      }
      
      @keyframes fadeInDown{
        from{opacity:0;transform:translateY(-20px);}
        to{opacity:1;transform:translateY(0);}
      }
      @keyframes fadeInUp{
        from{opacity:0;transform:translateY(20px);}
        to{opacity:1;transform:translateY(0);}
      }
      @keyframes fadeIn{
        from{opacity:0;}
        to{opacity:1;}
      }
      
      .logo{
        width:80px;
        height:80px;
        border-radius:20px;
        background:linear-gradient(135deg,var(--accent),#06b6d4);
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-weight:700;
        font-size:32px;
        box-shadow:0 20px 60px rgba(139,92,246,0.4), 0 0 40px rgba(139,92,246,0.2);
        position:relative;
        transition:transform 0.3s ease;
      }
      
      .logo::before{
        content:'';
        position:absolute;
        inset:-2px;
        border-radius:20px;
        padding:2px;
        background:linear-gradient(135deg, rgba(139,92,246,0.5), rgba(6,182,212,0.5));
        -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite:xor;
        mask-composite:exclude;
        opacity:0;
        transition:opacity 0.3s;
      }
      
      .logo:hover{transform:scale(1.05);}
      .logo:hover::before{opacity:1;}
      
      .hero h1{
        color:#fff;
        margin:0;
        font-size:36px;
        font-weight:700;
        letter-spacing:-0.5px;
      }
      
      .hero p{
        margin:4px 0 0 0;
        color:rgba(255,255,255,0.7);
        font-size:15px;
      }

      .controls{
        display:flex;
        gap:12px;
        align-items:center;
        margin-bottom:32px;
        flex-wrap:wrap;
        animation:fadeIn 0.8s ease-out 0.2s both;
      }
      
      .search-input{
        flex:1;
        min-width:280px;
        max-width:480px;
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.1);
        color:#fff;
        border-radius:12px;
        padding:12px 16px;
        font-size:14px;
        transition:all 0.3s ease;
        backdrop-filter:blur(8px);
      }
      
      .search-input:focus{
        outline:none;
        background:rgba(255,255,255,0.08);
        border-color:var(--accent);
        box-shadow:0 0 0 3px rgba(139,92,246,0.1), 0 8px 24px rgba(139,92,246,0.2);
      }
      
      .search-input::placeholder{color:rgba(255,255,255,0.4);}
      
      .cards{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
        gap:20px;
        animation:fadeIn 1s ease-out 0.4s both;
      }
      
      .card-glass{
        background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
        backdrop-filter:blur(12px);
        border-radius:16px;
        padding:24px;
        box-shadow:0 8px 32px rgba(0,0,0,0.4);
        border:1px solid rgba(255,255,255,0.08);
        transition:all 0.3s ease;
        position:relative;
        overflow:hidden;
      }
      
      .card-glass::before{
        content:'';
        position:absolute;
        top:0;left:0;right:0;
        height:1px;
        background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      }
      
      .card-glass:hover{
        transform:translateY(-4px);
        box-shadow:0 12px 48px rgba(139,92,246,0.3);
        border-color:rgba(139,92,246,0.3);
      }
      
      .card-glass .d-flex > *:first-child { min-width: 0; }

      .platform{
        font-weight:700;
        font-size:18px;
        color:white;
        margin-bottom:4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      
      .username{
        color:var(--muted);
        font-size:13px;
        margin-bottom:12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      
      .note{
        color:rgba(255,255,255,0.6);
        font-size:13px;
        line-height:1.5;
        margin-top:12px;
        padding-top:12px;
        border-top:1px solid rgba(255,255,255,0.06);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        word-break: break-word;
      }
      
      .pw{
        font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;
        background:rgba(0,0,0,0.3);
        padding:8px 12px;
        border-radius:8px;
        color:#fff;
        font-size:14px;
        letter-spacing:0.5px;
        word-break: break-all;
      }

      .btn-sm{ padding: 0.25rem 0.5rem; font-size: .875rem; border-radius: 0.2rem; }
      
      .btn-outline-accent{
        color:var(--accent);
        background:rgba(139,92,246,0.1);
        border:1px solid rgba(139,92,246,0.2);
        transition:all 0.3s ease;
      }
      
      .btn-outline-accent:hover{
        background:rgba(139,92,246,0.2);
        border-color:rgba(139,92,246,0.4);
        transform:scale(1.05);
      }
      
      .btn-outline-light{
        background:rgba(255,255,255,0.05);
        color:rgba(255,255,255,0.9);
        border:1px solid rgba(255,255,255,0.1);
        transition:all 0.3s ease;
      }
      
      .btn-outline-light:hover{
        background:rgba(255,255,255,0.1);
        border-color:rgba(255,255,255,0.2);
        transform:translateY(-2px);
      }
      
      /* Responsive */
      @media(max-width:768px){
        .site-wrap{padding:32px 20px;}
        .hero{flex-direction:column;text-align:center;}
        .hero h1{font-size:28px;}
        .cards{grid-template-columns:1fr;}
        .controls{flex-direction:column;align-items:stretch;}
        .search-input{max-width:100%;}
      }
    </style>
  </head>
  <body>
    <div class="site-wrap">
      <div class="hero">
        <div class="logo">Ex</div>
        <div>
          <h1>Vault Export</h1>
          <p>Read-only export generated on {{ generation_date }}.</p>
        </div>
      </div>
      <div class="controls">
        <input id="q" class="form-control search-input" placeholder="Search platform or username" />
      </div>
      <div id="list" class="cards"></div>
    </div>

  <script>
    // Data is embedded directly in the script
    const accounts = {{ accounts_json | safe }};

    function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]); }

    function render(){
      const qv = document.getElementById('q').value.toLowerCase();
      const root = document.getElementById('list');
      root.innerHTML = '';
      accounts.filter(a => (a.platform + ' ' + a.username).toLowerCase().includes(qv)).forEach(it => {
        const el = document.createElement('div');
        el.className='card-glass';
        el.innerHTML = `
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="platform">${escapeHtml(it.platform)}</div>
              <div class="username">${escapeHtml(it.username)}</div>
            </div>
            <div class="text-end">
              <button class="btn btn-sm btn-outline-accent" onclick="showPw('pw-field-${it.id}', this)" title="Show password"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          ${it.note ? `<div class="note">${escapeHtml(it.note)}</div>` : ''}
          <div class="mt-3 d-flex justify-content-between align-items-center">
            <span class="pw" id="pw-field-${it.id}" data-pw="${escapeHtml(it.password)}">****</span>
            <button class="btn btn-sm btn-outline-light" onclick="copyPw('${escapeHtml(it.password)}', this)">Copy</button>
          </div>
        `;
        root.appendChild(el);
      });
    }

    function showPw(elemId, btn) {
      const el = document.getElementById(elemId);
      if (el.textContent === '****') {
        el.textContent = el.dataset.pw;
        btn.innerHTML = '<i class="bi bi-eye-slash"></i>';
      } else {
        el.textContent = '****';
        btn.innerHTML = '<i class="bi bi-eye"></i>';
      }
    }

    async function copyPw(password, btn) {
      try {
        await navigator.clipboard.writeText(password);
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = originalText; }, 1500);
      } catch(e) {
        alert('Failed to copy');
      }
    }

    document.addEventListener('DOMContentLoaded', ()=> {
      document.getElementById('q').addEventListener('input', render);
      render();
    });
  </script>

  </body>
</html>
